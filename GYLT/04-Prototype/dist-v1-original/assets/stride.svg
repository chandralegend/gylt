<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 220" fill="none" role="img" aria-labelledby="stride-title">
  <title id="stride-title">An everyday sneaker, already on the move</title>
  <ellipse cx="172" cy="202" rx="79" ry="9" fill="#D14428" opacity=".58"/>
  <g stroke="#20231F" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="m23 86 28 7M13 110l31 6M29 136l15 3"/>
    <path d="m246 30 4 13 14 4-14 5-4 14-5-14-13-5 13-4 5-13Z" fill="#F5F0E4" stroke-width="3.5"/>
  </g>
  <g transform="rotate(-14 164 128)" stroke="#20231F" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round">
    <!-- A deep, rounded outsole gives the small silhouette its weight. -->
    <path d="M55 148c26 6 66 12 113 15 35 2 71-1 95-9l2 11c1 9-6 17-18 18l-166-7c-16-1-28-11-26-28Z" fill="#D14428"/>
    <path d="m69 164 12 12m18-10 9 11m19-9 7 10m22-9 4 10m25-10 1 11m26-12-2 13m25-15-5 16" stroke-width="3.5"/>
    <!-- Upper, heel and generously rounded toe. -->
    <path d="m57 145 11-42c2-8 8-12 15-12l11-27c2-6 7-7 12-5l23 9c8 3 13 9 19 19l22 26 54 12c21 5 33 14 38 27l1 6c-26 8-56 10-91 7l-99-8c-9-1-14-5-16-12Z" fill="#F5F0E4"/>
    <!-- Open collar and a small heel pull tab. -->
    <path d="m83 91 10-22c3-6 8-7 14-5l21 8c6 3 10 7 12 13l-9 15-48-9Z" fill="#20231F"/>
    <path d="m76 92 8-21 10 4-9 24-9-7Z" fill="#D14428"/>
    <!-- Tongue, with a distinctive plain color patch rather than a brand mark. -->
    <path d="m109 101 9-22c2-5 7-7 11-4l12 8 39 42-25 12-46-36Z" fill="#F5F0E4"/>
    <path d="m125 86 7 2 10 12-10 6-11-12 4-8Z" fill="#D14428" stroke-width="3"/>
    <!-- Heel seam and side panel. -->
    <path d="m83 93 19 11-14 51M102 104l20 26c6 8 16 11 28 11l34-1" stroke-width="3.5"/>
    <path d="m104 125 14 16-5 13-16-2 7-27Z" fill="#D14428" stroke-width="3.5"/>
    <!-- Lace bridge and wide, graphic laces remain legible at icon size. -->
    <path d="m118 107 31-10m-21 22 33-10m-22 23 34-11" stroke-width="5.5"/>
    <!-- Reinforced toe cap and short ventilation marks. -->
    <path d="M207 123c-7 8-9 20-8 29m-10-23-1 4m-12-7-1 4" stroke-width="3"/>
    <path d="M58 148c28 8 66 12 115 15 34 2 66 0 90-8" stroke-width="4.5"/>
    <path d="m216 143 15 3m-3-12 12 4" stroke-width="3" opacity=".5"/>
  </g>
</svg>
